[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miner"
version = "0.2.0"
description = "Herramienta CLI para procesar GitHub Agentic Workflows y generar datasets Parquet."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pandas>=3.0.5",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.0.0",
    "pyyaml>=6.0",
    "pyarrow>=25.0.1",
    "jupyterlab>=4.6.3",
    "ipykernel>=7.23.1",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
miner = "miner.cli:app"