[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miner"
version = "0.1.0"
description = "Herramienta CLI para identificar repositorios que utilizan GitHub Agentic Workflows (GH-AW)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
miner = "miner.cli:app"